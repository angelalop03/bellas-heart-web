name: Publicar web (GitHub Pages)

# Compila el juego a JavaScript (TeaVM) y lo publica en GitHub Pages en cada push a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon :core:test

      - name: Compilar versión web
        run: ./gradlew --no-daemon :web:gdx_teavm_web_js_release_build

      - name: Preparar carpeta publicada
        run: rm -rf web/build/dist/js/release/webapp/WEB-INF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/js/release/webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
